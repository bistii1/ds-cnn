# Keyword Spotting dataset — 30 classes (real CC-BY audio only, no TTS)
# Every clip normalized to 16 kHz mono / 2 s after `make normalize`.
# Cap: max 1500 per label. Equal trim uses balance_target (bottleneck: previous ~1019).

audio:
  sample_rate: 16000
  channels: 1
  clip_ms: 2000
  target_dbfs: -20.0
  trim_top_db: 30.0
  pad_mode: "start"
  bit_depth: "PCM_16"

mfcc_reference:
  frame_length_ms: 30
  frame_stride_ms: 20
  num_filters: 48          # was 40: finer mel resolution
  num_coefficients: 13     # was 10: more MFCC detail for confusable words
  fmin_hz: 20
  fmax_hz: 7600            # was 4000: keep high-freq sibilants (/s/,/t/) that separate six/eight/start/stop

# DSP front-end selection. Controls which MFCC implementation produces training
# features (and the int8 representative dataset). See src/mfcc.py.
#   backend:
#     tf       -> tf.signal MFCC (original float reference)
#     arm_q15  -> CMSIS-DSP arm_mfcc_q15  (FIXED POINT, matches on-device arm_math;
#                 lowest preprocessing latency on the nRF5340 Cortex-M33)
#     arm_f32  -> CMSIS-DSP arm_mfcc_f32  (float parity/debug reference)
#   window: hann | hamming  (MUST match the window baked into device dsp_constants.h)
# NOTE: switching backend changes feature values -> retrain the model and let the
#       trainer recompute feature_norm (mean/std). Then regenerate dsp_constants.h
#       (python src/gen_dsp_constants.py) and share it with the firmware.
dsp:
  backend: arm_f32         # tf | arm_q15 | arm_f32
  window: hann             # hann | hamming
  q15_output_scale: 0.0078125   # 1/128 (q8.7): raw q15 MFCC -> float before norm

sampling:
  max_per_class: 1500       # never exceed 1500 during extraction
  balance_target: 1000      # equal trim; limited by previous (~1019 real MSWC clips)
  seed: 42

vocabulary:
  google_speech_commands:
    left: left
    right: right
    stop: stop
    zero: zero
    one: one
    two: two
    three: three
    four: four
    five: five
    six: six
    seven: seven
    eight: eight
    nine: nine
    # added (GSC-native confirmations; quote yes/no so YAML does not parse as bools)
    "yes": "yes"
    "no": "no"

  mswc_en:
    back: back
    close: close
    start: start
    call: call
    # added (all have >=1000 real MSWC English clips)
    play: play
    next: next
    previous: previous
    open: open
    answer: answer
    help: help
    record: record
    search: search

  concatenated:
    volume_up: "volume up"
    volume_down: "volume down"

  timers_and_such:
    set_a_timer: "set a timer"

components:
  volume: mswc_en
  up: google_speech_commands
  down: google_speech_commands

concat_recipe:
  volume_up: [volume, up]
  volume_down: [volume, down]
