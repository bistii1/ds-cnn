# Keyword Spotting dataset — snowballlab/30-keywords-v2
# 16 kHz mono, fixed 1 s, 1,000 clips per class. Official HF test stays test.
# Prepare wavs with:  python src/prepare_hf_v2.py

audio:
  sample_rate: 16000
  channels: 1
  clip_ms: 1000
  target_dbfs: -20.0
  trim_top_db: 30.0
  pad_mode: "start"
  bit_depth: "PCM_16"

mfcc_reference:
  frame_length_ms: 30
  frame_stride_ms: 20
  num_filters: 48          # was 40: finer mel resolution
  num_coefficients: 13     # was 10: more MFCC detail for confusable words
  fmin_hz: 20
  fmax_hz: 7600            # was 4000: keep high-freq sibilants (/s/,/t/) that separate six/eight/start/stop

# DSP front-end selection. Controls which MFCC implementation produces training
# features (and the int8 representative dataset). See src/mfcc.py.
#   backend:
#     tf       -> tf.signal MFCC (original float reference)
#     arm_q15  -> CMSIS-DSP arm_mfcc_q15  (FIXED POINT, matches on-device arm_math;
#                 lowest preprocessing latency on the nRF5340 Cortex-M33)
#     arm_f32  -> CMSIS-DSP arm_mfcc_f32  (float parity/debug reference)
#   window: hann | hamming  (MUST match the window baked into device dsp_constants.h)
# NOTE: switching backend changes feature values -> retrain the model and let the
#       trainer recompute feature_norm (mean/std). Then regenerate dsp_constants.h
#       (python src/gen_dsp_constants.py) and share it with the firmware.
dsp:
  backend: arm_f32         # tf | arm_q15 | arm_f32
  window: hann             # hann | hamming
  q15_output_scale: 0.0078125   # 1/128 (q8.7): raw q15 MFCC -> float before norm

sampling:
  max_per_class: 1000
  balance_target: 1000      # HF v2 ships 1,000 clips per class
  seed: 42

# Official 30-class list from snowballlab/30-keywords-v2.
# Drops volume_up / volume_down / set_a_timer; adds up / down / go.
vocabulary:
  hf_v2:
    answer: answer
    back: back
    call: call
    close: close
    down: down
    eight: eight
    five: five
    four: four
    go: go
    help: help
    left: left
    next: next
    nine: nine
    "no": "no"
    one: one
    open: open
    play: play
    previous: previous
    record: record
    right: right
    search: search
    seven: seven
    six: six
    start: start
    stop: stop
    three: three
    two: two
    up: up
    "yes": "yes"
    zero: zero
